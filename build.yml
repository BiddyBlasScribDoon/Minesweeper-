name: Build Minesweeper

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile
        shell: cmd
        run: cl /nologo /EHsc /O2 /W3 /MT /std:c++17 /DUNICODE /D_UNICODE Minesweeper.cpp /Fe:Minesweeper.exe /link /SUBSYSTEM:WINDOWS

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: Minesweeper-exe
          path: Minesweeper.exe
